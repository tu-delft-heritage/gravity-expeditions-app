name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      reset_iiif_cache:
        description: Regenerate IIIF derivatives without restoring their cache
        required: false
        default: false
        type: boolean
      reset_annotations_cache:
        description: Re-fetch remote georeference annotations
        required: false
        default: false
        type: boolean
      reset_thumbnails_cache:
        description: Regenerate thumbnails and their source cache
        required: false
        default: false
        type: boolean

permissions:
  actions: write
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out content
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.22.0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up native renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb xauth libopengl0 libglx0 libcurl4t64 libjpeg-turbo8 \
            libuv1t64 libx11-6 libxext6 libwebp7 libicu74 libpng16-16t64

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore IIIF derivatives
        if: ${{ !inputs.reset_iiif_cache }}
        id: iiif-cache
        uses: actions/cache/restore@v6
        with:
          path: node_modules/.vite/slides/iiif
          key: iiif-v3-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            iiif-v3-${{ runner.os }}

      - name: Restore remote annotations
        if: ${{ !inputs.reset_annotations_cache }}
        uses: actions/cache/restore@v6
        with:
          path: node_modules/.vite/slides/annotations
          key: annotations-v2-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            annotations-v2-${{ runner.os }}-

      - name: Restore thumbnails and map sources
        if: ${{ !inputs.reset_thumbnails_cache }}
        uses: actions/cache/restore@v6
        with:
          path: node_modules/.vite/slides/thumbnails
          key: thumbnails-v4-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            thumbnails-v4-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build static site
        id: build-static-site
        env:
          PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          PUBLIC_URL: ${{ steps.pages.outputs.base_url }}
        run: xvfb-run -a pnpm exec slides build . --outDir dist/site

      - name: Save IIIF derivatives
        if: ${{ success() || steps.build-static-site.outcome == 'failure' }}
        uses: actions/cache/save@v6
        with:
          path: node_modules/.vite/slides/iiif
          key: iiif-v3-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save remote annotations
        if: ${{ success() || steps.build-static-site.outcome == 'failure' }}
        uses: actions/cache/save@v6
        with:
          path: node_modules/.vite/slides/annotations
          key: annotations-v2-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save thumbnails and map sources
        if: ${{ success() || steps.build-static-site.outcome == 'failure' }}
        uses: actions/cache/save@v6
        with:
          path: node_modules/.vite/slides/thumbnails
          key: thumbnails-v4-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
